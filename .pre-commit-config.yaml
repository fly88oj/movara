# Pre-commit hooks: install once with `pre-commit install`, then every
# commit and push runs the same checks the CI enforces.
# Docs: https://pre-commit.com
default_stages: [pre-commit, commit-msg]
repos:
  # --- general hygiene (pre-commit-hooks) ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  # --- rust code standards ---
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy -D warnings
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  # --- commit message standard: Conventional Commits 1.0.0 ---
  - repo: local
    hooks:
      - id: conventional-commit
        name: conventional commit message
        entry: scripts/check-commit-msg.sh
        language: script
        stages: [commit-msg]

  # --- no local/dev-environment info leaks ---
  - repo: local
    hooks:
      - id: no-local-info
        name: reject local machine info in tracked files
        entry: scripts/check-no-local-info.sh
        language: script
        types: [text]
