# Isolated test matrix for movara. Every service is throwaway: agent
# installs land in the container, state is generated under /tmp/home,
# the host is never touched. Run from the repo root:
#
#   docker compose -f docker/compose.yaml run --rm test
#
# Per-agent verification services (goose, codebuff, ...) are
# added alongside their adapters; each installs the real agent CLI in
# its own container and exercises movara against generated state.
name: movara-test

services:
  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test

  goose:
    build:
      context: ..
      dockerfile: docker/agents/goose.Dockerfile

  gptme:
    build:
      context: ..
      dockerfile: docker/agents/gptme.Dockerfile

  codebuff:
    build:
      context: ..
      dockerfile: docker/agents/codebuff.Dockerfile

  openhands:
    build:
      context: ..
      dockerfile: docker/agents/openhands.Dockerfile

  copilot:
    build:
      context: ..
      dockerfile: docker/agents/copilot.Dockerfile

  openinterpreter:
    build:
      context: ..
      dockerfile: docker/agents/oi.Dockerfile

  warp:
    build:
      context: ..
      dockerfile: docker/agents/warp.Dockerfile

  cline:
    build:
      context: ..
      dockerfile: docker/agents/cline.Dockerfile

  roo:
    build:
      context: ..
      dockerfile: docker/agents/roo.Dockerfile

  kilo:
    build:
      context: ..
      dockerfile: docker/agents/kilo.Dockerfile

  qoder:
    build:
      context: ..
      dockerfile: docker/agents/qoder.Dockerfile

  trae:
    build:
      context: ..
      dockerfile: docker/agents/trae.Dockerfile
